<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Jot it down. Find it fast.</p>
  </header>

  <main>
    <section id="add-section" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a note</h2>
      <form id="note-form" novalidate>
        <div class="field field-grow">
          <label for="note-input">Note</label>
          <input type="text" id="note-input" placeholder="Type your note here...">
        </div>
        <div class="field">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>
        <button type="submit" id="add-button">Add Note</button>
      </form>
      <p id="error-message" role="alert"></p>
    </section>

    <section id="notes-section" aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <label for="search-input">Search notes</label>
      <input type="search" id="search-input" placeholder="Search...">
      <p id="note-count"></p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026 &middot; Notes are saved in your browser.</p>
  </footer>
</body>
</html>
